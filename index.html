<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webgame</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --ink:#0c0e12; --panel:#15181e; --line:rgba(241,237,228,.12);
  --text:#f1ede4; --muted:#9a968d; --accent:#ffcf4a;
  --display:'Anton','Impact','Arial Narrow Bold',sans-serif;
  --body:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ink);color:var(--text);font-family:var(--body);min-height:100vh;
  background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.05) 1px,transparent 0);background-size:22px 22px}
.wrap{max-width:1100px;margin:0 auto;padding:56px 16px 40px}
header{margin-bottom:40px}
.eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{font-family:var(--display);font-weight:400;font-size:clamp(48px,10vw,96px);line-height:.95;margin:8px 0 12px;letter-spacing:.01em}
.lead{color:var(--muted);max-width:52ch;margin:0;font-size:17px;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.card{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  color:inherit;text-decoration:none;transition:transform .15s,border-color .15s,box-shadow .15s}
.card:hover,.card:focus-visible{transform:translateY(-4px);border-color:rgba(255,255,255,.3);box-shadow:0 14px 40px rgba(0,0,0,.45);outline:none}
.art{position:relative;aspect-ratio:16/9;display:grid;place-items:center;overflow:hidden}
.art .name{position:relative;font-family:var(--display);font-size:clamp(30px,4vw,40px);letter-spacing:.03em;text-align:center;padding:0 16px;line-height:1;
  text-shadow:0 3px 0 rgba(0,0,0,.35)}
.body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.body h2{margin:0;font-size:20px;font-weight:800}
.body p{margin:0;color:var(--muted);line-height:1.5;font-size:15px;flex:1}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.07);color:var(--text)}
.play{font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:14px;color:var(--accent)}
.card:hover .play::after{content:' →'}

/* Spelbilder */
.art.dorza{background:linear-gradient(180deg,#8fb6e8 0%,#ffb3c9 58%,#ff6a2b 100%)}
.art.dorza::before{content:'';position:absolute;left:-10%;right:-10%;bottom:-40%;height:80%;
  background:repeating-linear-gradient(90deg,transparent 0 46%,rgba(255,255,255,.85) 46% 54%,transparent 54% 100%) center/60px 100% no-repeat,#1b2440;
  transform:perspective(200px) rotateX(55deg)}
.art.dorza .name{color:#fff;font-style:italic}
.art.big{background:#0f1113}
.art.big::before{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(-45deg,#e23b2e 0 18px,#0f1113 18px 36px);opacity:.35}
.art.big .name{color:#f3c21b;font-size:clamp(40px,6vw,56px)}
.art.big .name b{color:#e23b2e;font-weight:400}
.art.slir{background:linear-gradient(90deg,#2a1210,#0b0d14 50%,#0c1f2a)}
.art.slir::before,.art.slir::after{content:'';position:absolute;width:12px;border-radius:6px}
.art.slir::before{top:22%;bottom:22%;left:8%;background:#ff5a36;box-shadow:0 0 20px #ff5a36;transform:rotate(-8deg)}
.art.slir::after{top:30%;bottom:14%;right:8%;background:#36d6ff;box-shadow:0 0 20px #36d6ff;transform:rotate(6deg)}
.art.slir .name{font-style:italic;background:linear-gradient(90deg,#ff5a36,#ffcf4a 50%,#36d6ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}

footer{margin-top:48px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Spelsamling</div>
    <h1>Webgame</h1>
    <p class="lead">Små spel som körs direkt i webbläsaren. Välj ett och börja spela.</p>
  </header>

  <main class="grid" id="games"></main>

  <footer>Fler spel kommer.</footer>
</div>

<script>
// Lägg till nya spel här. "art" är en CSS-klass för spelbilden (se "Spelbilder" i stilen ovan).
const GAMES = [
  {
    file: 'Dorza_Horizon_6.html',
    title: 'Dorza Horizon 6',
    art: 'dorza',
    artName: 'Dorza Horizon 6',
    desc: 'Välj din första bil och kör fritt genom Japan. Samla bilar i Autoshow.',
    tags: ['Racing', '3D']
  },
  {
    file: '2big4you.html',
    title: '2Big4You',
    art: 'big',
    artName: '2BIG<b>4</b>YOU',
    desc: 'Tio dagar på dig att bli jacked. Handla protein, töm kylskåpet och glöm inte att sova.',
    tags: ['Gym', 'Utmaning']
  },
  {
    file: 'slirpong.html',
    title: 'Slirpong',
    art: 'slir',
    artName: 'SLIRPONG',
    desc: 'Pong på is. Racketen glider, bollen skruvar och går snabbare för varje träff. Mot datorn eller en kompis.',
    tags: ['Arkad', '2 spelare']
  }
];

const grid = document.getElementById('games');
for (const g of GAMES) {
  const a = document.createElement('a');
  a.className = 'card';
  a.href = g.file;
  a.innerHTML = `
    <div class="art ${g.art}"><div class="name">${g.artName}</div></div>
    <div class="body">
      <h2>${g.title}</h2>
      <p>${g.desc}</p>
      <div class="tags">${g.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
      <span class="play">Spela</span>
    </div>`;
  grid.appendChild(a);
}
</script>
</body>
</html>
